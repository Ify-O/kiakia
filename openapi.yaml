openapi: 3.1.0
info:
  title: Kiakia API
  version: 1.3.0
  summary: Every customer, answered fast.
  description: |
    The contract for Kiakia, a single inbox for small businesses that sell through chat.
    It is the **source of truth** (see `docs/adr/0001`): the server is tested against it, and the
    web UI is generated from it.

    Conventions:
    - JSON fields are `camelCase`. Times are RFC 3339 in **UTC** (e.g. `2026-11-24T18:55:24Z`);
      clients show them in the business's time zone.
    - Lists use **cursor pagination** (`limit` + opaque `cursor`, see `docs/adr/0003`).
    - Errors use **RFC 9457 Problem Details** (`application/problem+json`, see `docs/adr/0002`).
    - Fields that can be empty are marked nullable (`type: [string, "null"]`); they're always
      present in responses, never omitted.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  contact:
    name: Kiakia
    url: https://github.com/Ify-O/kiakia

servers:
  - url: http://localhost:8000
    description: Local development (the API runs on your own laptop)

# No authentication yet: the API only runs locally. Staff logins come with the multi-user work.
security: []

tags:
  - name: Conversations
    description: Chat threads with customers, including who is still waiting for a reply.
  - name: Messages
    description: The messages inside a conversation.
  - name: Replies
    description: Send a reply to a customer from Kiakia.
  - name: Customers
    description: The light customer list, with consent asked in the chat and recorded (docs/adr/0007).
  - name: Stats
    description: Numbers for the dashboard.
  - name: Health
    description: Is the API (and its database) up?

paths:
  /v1/conversations:
    get:
      operationId: listConversations
      tags: [Conversations]
      summary: List conversations
      description: |
        Conversations with filters and cursor pagination. Use `status=waiting&sort=longestWaiting`
        for the "customers still waiting for a reply" view, oldest wait first.
      parameters:
        - name: status
          in: query
          description: "`waiting` = the customer has messages with no reply yet. `answered` = the business replied last. `resolved` = marked done (see docs/adr/0006)."
          schema:
            type: string
            enum: [all, waiting, answered, resolved]
            default: all
        - name: category
          in: query
          description: Only conversations with this category; `none` = not categorised yet.
          schema:
            type: string
            enum: [enquiry, order, complaint, other, none]
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: channel
          in: query
          description: Only conversations on this channel.
          schema:
            $ref: "#/components/schemas/Channel"
        - name: q
          in: query
          description: Case-insensitive search in the customer's name or username.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: sort
          in: query
          description: "`recent` = most recent message first. `longestWaiting` = longest-waiting customer first (waiting conversations only)."
          schema:
            type: string
            enum: [recent, longestWaiting]
            default: recent
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of conversations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: getConversation
      tags: [Conversations]
      summary: Get one conversation
      description: Full details of one conversation and its customer.
      responses:
        "200":
          description: The conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      operationId: updateConversation
      tags: [Conversations]
      summary: Resolve, reopen or categorise a conversation
      description: |
        Set `resolved` and/or `category` (at least one). Values are *set*, not toggled, so repeating
        the same request gives the same result (naturally idempotent; no Idempotency-Key needed).
        A resolved conversation leaves the waiting list until the customer writes again (docs/adr/0006).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationUpdate"
            example:
              resolved: true
              category: order
      responses:
        "200":
          description: The updated conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/conversations/{conversationId}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: listMessages
      tags: [Messages]
      summary: List the messages in a conversation
      description: Newest message first. Follow `page.nextCursor` to load older messages.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/conversations/{conversationId}/replies:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      operationId: createReply
      tags: [Replies]
      summary: Send a reply to the customer
      description: |
        Sends `text` to the customer on the conversation's channel and stores it as an outgoing
        message. The conversation stops being "waiting".

        **Idempotent** (see `docs/adr/0004`): send a unique `Idempotency-Key` per reply. Repeating
        the same request with the same key returns the original result and does **not** send the
        message again (`Idempotent-Replayed: true`). Reusing a key with a different body returns 409.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: A unique value per reply, created once by the client (a UUID is recommended).
          schema:
            type: string
            minLength: 8
            maxLength: 255
            pattern: "^[A-Za-z0-9_-]+$"
          example: 5f1d8a2e-7c3b-4e1a-9b6f-2d4c8e0a1b3f
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyCreate"
            example:
              text: "Hi Ada! The blue bag is ₦15,000. Shall I reserve one for you?"
      responses:
        "201":
          description: The reply was sent and stored (or replayed from an earlier identical request).
          headers:
            Location:
              description: URL of the conversation's messages.
              schema:
                type: string
            Idempotent-Replayed:
              description: "`true` when this response is a replay of an earlier request with the same key."
              schema:
                type: string
                enum: ["true", "false"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/messages:
    get:
      operationId: listAllMessages
      tags: [Messages]
      summary: List messages across all conversations
      description: Newest first, with the customer each message belongs to. For the "messages by platform" view.
      parameters:
        - name: channel
          in: query
          description: Only messages on this channel.
          schema:
            $ref: "#/components/schemas/Channel"
        - name: direction
          in: query
          description: "`in` = from customers, `out` = our replies."
          schema:
            $ref: "#/components/schemas/Direction"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/customers:
    get:
      operationId: listCustomers
      tags: [Customers]
      summary: List customers
      description: Everyone who has written to the business, most recent contact first, with their consent status.
      parameters:
        - name: q
          in: query
          description: Case-insensitive search in name, username, phone or email.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: detailsConsent
          in: query
          description: Only customers with this "save my details" status.
          schema:
            $ref: "#/components/schemas/ConsentStatus"
        - name: marketingConsent
          in: query
          description: Only customers with this "send me offers" status.
          schema:
            $ref: "#/components/schemas/ConsentStatus"
        - name: channel
          in: query
          description: Only customers we know on this channel.
          schema:
            $ref: "#/components/schemas/Channel"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of customers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/customers/{customerId}:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    get:
      operationId: getCustomer
      tags: [Customers]
      summary: Get one customer
      description: The customer with their platforms, conversations and full consent history.
      responses:
        "200":
          description: The customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/customers/{customerId}/consent:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    post:
      operationId: recordConsent
      tags: [Customers]
      summary: Record a consent question or answer
      description: |
        Records that we **asked**, or that the customer **granted**, **declined** or **withdrew** consent,
        for `details` ("save my details") or `marketing` ("send me offers"). Pass the `conversationId`
        where it happened: its latest customer message is kept as evidence.
        - `details` (name/phone/email) may only be sent with `kind: details, status: granted`.
        - Declining or withdrawing `details` erases phone and email.
        - Recording the customer's current status again changes nothing (safe to repeat).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRecord"
            example:
              kind: details
              status: granted
              conversationId: 42
              details:
                name: Ada Test
                phone: "+234 803 123 4567"
                email: ada@example.com
      responses:
        "200":
          description: The customer after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/stats:
    get:
      operationId: getStats
      tags: [Stats]
      summary: Dashboard numbers
      description: |
        Counts for a period (`from`/`to`; default: all time) plus the situation **right now**
        (`waiting`, `oldestWaitingSince`). Definitions are in docs/adr/0006.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Current numbers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxStats"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Health check
      description: "`200` when the API and its database work; `503` when the database is unreachable."
      responses:
        "200":
          description: Everything works.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      description: The conversation's id.
      schema:
        type: integer
        format: int64
        minimum: 1
    CustomerId:
      name: customerId
      in: path
      required: true
      description: The customer's id.
      schema:
        type: integer
        format: int64
        minimum: 1
    From:
      name: from
      in: query
      description: Only include items at or after this time (RFC 3339, e.g. 2026-11-24T00:00:00Z). Must be before `to`.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: Only include items before this time (exclusive).
      schema:
        type: string
        format: date-time
    Limit:
      name: limit
      in: query
      description: How many items to return (1–100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Opaque value from `page.nextCursor` of the previous page. Don't build or change it. Any value the server didn't issue for this list (and sort order) returns 400.
      schema:
        type: string
        minLength: 1
        maxLength: 500

  schemas:
    Channel:
      type: string
      description: Where the conversation happens.
      enum: [telegram, messenger, instagram, whatsapp, tiktok, email]

    Direction:
      type: string
      description: "`in` = from the customer, `out` = from the business."
      enum: [in, out]

    MessageKind:
      type: string
      enum: [text, voice, audio, image, video, document, sticker, other]

    ConversationStatus:
      type: string
      description: |
        `waiting` = the customer has messages with no reply yet. `answered` = the business replied last.
        `resolved` = someone marked it done; a new customer message makes it `waiting` again.
      enum: [waiting, answered, resolved]

    Category:
      type: string
      description: What the conversation is about. Set by staff; a light label, not a CRM (docs/adr/0006).
      enum: [enquiry, order, complaint, other]

    Contact:
      type: object
      additionalProperties: false
      required: [id, displayName, username, detailsConsent, marketingConsent]
      properties:
        id:
          type: integer
          format: int64
        displayName:
          type: string
          description: Name to show, e.g. "Ada Test" or "@buyer_two".
          example: Ada Test
        username:
          type: [string, "null"]
          description: The customer's handle on the channel, if they have one.
          example: ada_test
        detailsConsent:
          $ref: "#/components/schemas/ConsentStatus"
        marketingConsent:
          $ref: "#/components/schemas/ConsentStatus"

    ConversationFields:
      description: Fields shared by ConversationSummary and ConversationDetail (not used on its own).
      type: object
      required:
        - id
        - channel
        - contact
        - status
        - waitingSince
        - lastMessageAt
        - lastReplyAt
        - lastMessagePreview
        - unansweredCount
        - category
        - resolvedAt
      properties:
        id:
          type: integer
          format: int64
          example: 42
        channel:
          $ref: "#/components/schemas/Channel"
        contact:
          $ref: "#/components/schemas/Contact"
        status:
          $ref: "#/components/schemas/ConversationStatus"
        waitingSince:
          type: [string, "null"]
          format: date-time
          description: Time of the first customer message without a reply. `null` when not waiting.
        lastMessageAt:
          type: string
          format: date-time
          description: Time of the most recent message in either direction.
        lastReplyAt:
          type: [string, "null"]
          format: date-time
          description: When the business last replied. `null` if it never has.
        lastMessagePreview:
          type: [string, "null"]
          maxLength: 120
          description: Start of the latest customer message, or e.g. "[voice]" for media. `null` if there is none.
          example: Hello, how much is the blue bag?
        unansweredCount:
          type: integer
          minimum: 0
          description: Customer messages since the last reply (or since it was resolved).
        category:
          oneOf:
            - $ref: "#/components/schemas/Category"
            - type: "null"
          description: The label staff gave this conversation, or `null`.
        resolvedAt:
          type: [string, "null"]
          format: date-time
          description: When it was marked resolved, or `null`. Stays set if the customer writes again (then `status` is `waiting`).

    ConversationSummary:
      description: A conversation as shown in lists.
      allOf:
        - $ref: "#/components/schemas/ConversationFields"
      unevaluatedProperties: false

    ConversationDetail:
      description: A conversation with extra details.
      allOf:
        - $ref: "#/components/schemas/ConversationFields"
        - type: object
          required: [createdAt, messageCount]
          properties:
            createdAt:
              type: string
              format: date-time
            messageCount:
              type: integer
              minimum: 0
      unevaluatedProperties: false

    Message:
      type: object
      additionalProperties: false
      required: [id, conversationId, channel, direction, kind, body, hasMedia, sentAt]
      properties:
        id:
          type: integer
          format: int64
        conversationId:
          type: integer
          format: int64
        channel:
          $ref: "#/components/schemas/Channel"
        direction:
          $ref: "#/components/schemas/Direction"
        kind:
          $ref: "#/components/schemas/MessageKind"
        body:
          type: [string, "null"]
          description: Text or caption. `null` for media without a caption (e.g. a voice note).
        hasMedia:
          type: boolean
          description: True for voice notes, images and other files.
        sentAt:
          type: string
          format: date-time

    FeedItem:
      type: object
      additionalProperties: false
      required: [message, contact]
      properties:
        message:
          $ref: "#/components/schemas/Message"
        contact:
          $ref: "#/components/schemas/Contact"

    FeedPage:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/FeedItem"
        page:
          $ref: "#/components/schemas/PageInfo"

    ConversationUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one of the fields. Omitted fields are left unchanged.
      properties:
        resolved:
          type: boolean
          description: "`true` marks it resolved (it leaves the waiting list); `false` reopens it."
        category:
          oneOf:
            - $ref: "#/components/schemas/Category"
            - type: "null"
          description: Set a label, or `null` to remove it.

    ChannelStats:
      type: object
      additionalProperties: false
      required: [channel, conversations, messages, messagesReceived, waiting, responseRate]
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        conversations:
          type: integer
          minimum: 0
        messages:
          type: integer
          minimum: 0
        messagesReceived:
          type: integer
          minimum: 0
        waiting:
          type: integer
          minimum: 0
        responseRate:
          type: [number, "null"]
          minimum: 0
          maximum: 1

    ConsentStatus:
      type: string
      description: |
        `unknown` = never asked (a 🆕 new customer). `asked` = question sent, no answer recorded yet.
        `granted` / `declined` = the customer's answer. `withdrawn` = granted before, then taken back
        (e.g. they replied STOP). See docs/adr/0007.
      enum: [unknown, asked, granted, declined, withdrawn]

    ConsentKind:
      type: string
      description: "`details` = save my name/phone/email. `marketing` = send me offers and sales."
      enum: [details, marketing]

    CustomerChannel:
      type: object
      additionalProperties: false
      required: [channel, username]
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        username:
          type: [string, "null"]

    CustomerFields:
      description: Fields shared by Customer and CustomerDetail (not used on its own).
      type: object
      required:
        - id
        - displayName
        - phone
        - email
        - detailsConsent
        - marketingConsent
        - firstChannel
        - channels
        - firstContactAt
        - lastContactAt
        - conversationCount
        - orderCount
      properties:
        id:
          type: integer
          format: int64
        displayName:
          type: string
        phone:
          type: [string, "null"]
          description: Only present when the customer agreed to save their details.
        email:
          type: [string, "null"]
          description: Only present when the customer agreed to save their details.
        detailsConsent:
          $ref: "#/components/schemas/ConsentStatus"
        marketingConsent:
          $ref: "#/components/schemas/ConsentStatus"
        firstChannel:
          $ref: "#/components/schemas/Channel"
        channels:
          type: array
          items:
            $ref: "#/components/schemas/CustomerChannel"
        firstContactAt:
          type: string
          format: date-time
        lastContactAt:
          type: string
          format: date-time
        conversationCount:
          type: integer
          minimum: 0
        orderCount:
          type: integer
          minimum: 0
          description: Conversations labelled `order`.

    Customer:
      allOf:
        - $ref: "#/components/schemas/CustomerFields"
      unevaluatedProperties: false

    CustomerConversation:
      type: object
      additionalProperties: false
      required: [id, channel, status, lastMessageAt]
      properties:
        id:
          type: integer
          format: int64
        channel:
          $ref: "#/components/schemas/Channel"
        status:
          $ref: "#/components/schemas/ConversationStatus"
        lastMessageAt:
          type: string
          format: date-time

    ConsentEvent:
      type: object
      additionalProperties: false
      required: [id, kind, status, channel, wording, evidenceMessageId, recordedAt]
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/ConsentKind"
        status:
          $ref: "#/components/schemas/ConsentStatus"
        channel:
          oneOf:
            - $ref: "#/components/schemas/Channel"
            - type: "null"
        wording:
          type: [string, "null"]
          description: The exact question we asked (for `asked`).
        evidenceMessageId:
          type: [integer, "null"]
          format: int64
          description: The customer's message that answered (or STOP), kept as proof.
        recordedAt:
          type: string
          format: date-time

    CustomerDetail:
      allOf:
        - $ref: "#/components/schemas/CustomerFields"
        - type: object
          required: [conversations, consentHistory]
          properties:
            conversations:
              type: array
              items:
                $ref: "#/components/schemas/CustomerConversation"
            consentHistory:
              type: array
              description: Oldest first. Append-only.
              items:
                $ref: "#/components/schemas/ConsentEvent"
      unevaluatedProperties: false

    CustomerPage:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
        page:
          $ref: "#/components/schemas/PageInfo"

    ConsentRecord:
      description: |
        Either an answer that includes the customer's details (only possible for `kind: details,
        status: granted`), or any other consent record without details (docs/adr/0007).
      anyOf:
        - $ref: "#/components/schemas/ConsentRecordWithDetails"
        - $ref: "#/components/schemas/ConsentRecordPlain"

    ConsentRecordPlain:
      type: object
      additionalProperties: false
      required: [kind, status]
      properties:
        kind:
          $ref: "#/components/schemas/ConsentKind"
        status:
          type: string
          enum: [asked, granted, declined, withdrawn]
        conversationId:
          type: integer
          format: int64
          minimum: 1
          description: Where it happened (gives the channel and the evidence message).
        wording:
          type: string
          minLength: 1
          maxLength: 1000
          description: The exact question sent (for `asked`).

    ConsentRecordWithDetails:
      type: object
      additionalProperties: false
      required: [kind, status, details]
      description: The customer said YES to "save my details" and shared some of them.
      properties:
        kind:
          type: string
          enum: [details]
        status:
          type: string
          enum: [granted]
        conversationId:
          type: integer
          format: int64
          minimum: 1
        wording:
          type: string
          minLength: 1
          maxLength: 1000
        details:
          $ref: "#/components/schemas/CustomerDetails"

    CustomerDetails:
      type: object
      additionalProperties: false
      minProperties: 1
      description: "Only what the customer chose to share. Only allowed with `kind: details, status: granted`."
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "\\S"
        phone:
          type: string
          minLength: 7
          maxLength: 20
          pattern: "^\\+?[0-9][0-9 ()-]{5,19}$"
          example: "+234 803 123 4567"
        email:
          type: string
          maxLength: 254
          description: A practical email check (letters, digits and . _ % + - before the @; a domain with a dot after it).
          pattern: "^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\\.[A-Za-z0-9-]+)*\\.[A-Za-z]{2,}$"
          example: ada@example.com

    ReplyCreate:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: "\\S"
          description: The reply. Must contain at least one non-space character (`\\S`); leading and trailing spaces are removed. Max 4096 characters (Telegram's limit).

    PageInfo:
      type: object
      additionalProperties: false
      required: [limit, nextCursor]
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        nextCursor:
          type: [string, "null"]
          description: Pass as `cursor` to get the next page. `null` = this is the last page.

    ConversationPage:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSummary"
        page:
          $ref: "#/components/schemas/PageInfo"

    MessagePage:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        page:
          $ref: "#/components/schemas/PageInfo"

    InboxStats:
      type: object
      additionalProperties: false
      required:
        - contacts
        - conversations
        - messages
        - messagesReceived
        - waiting
        - oldestWaitingSince
        - responseRate
        - medianFirstResponseSeconds
        - messagesByKind
        - byChannel
        - byCategory
      properties:
        contacts:
          type: integer
          minimum: 0
          description: All customers (not limited to the period).
        conversations:
          type: integer
          minimum: 0
          description: Conversations with at least one customer message in the period.
        messages:
          type: integer
          minimum: 0
          description: Messages (both directions) sent in the period.
        messagesReceived:
          type: integer
          minimum: 0
          description: Customer messages received in the period.
        waiting:
          type: integer
          minimum: 0
          description: Customers waiting for a reply **right now** (not limited to the period).
        responseRate:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: Share of the period's conversations whose latest customer message is answered or resolved. `null` if there are none.
        medianFirstResponseSeconds:
          type: [integer, "null"]
          minimum: 0
          description: Median time from a customer's first unanswered message to our next reply, for replies sent in the period. `null` if none.
        byChannel:
          type: array
          description: The same numbers per channel (channels with no activity are left out).
          items:
            $ref: "#/components/schemas/ChannelStats"
        byCategory:
          type: object
          description: Conversations in the period per category; `none` = not categorised.
          propertyNames:
            enum: [enquiry, order, complaint, other, none]
          additionalProperties:
            type: integer
            minimum: 0
        oldestWaitingSince:
          type: [string, "null"]
          format: date-time
          description: When the longest-waiting customer started waiting (right now). `null` if nobody is waiting.
        messagesByKind:
          type: object
          description: Message count per kind; kinds with no messages are left out.
          propertyNames:
            $ref: "#/components/schemas/MessageKind"
          additionalProperties:
            type: integer
            minimum: 0
          example:
            text: 12
            voice: 3

    Health:
      type: object
      additionalProperties: false
      required: [status, database, demoMode]
      properties:
        status:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [ok]
        demoMode:
          type: boolean
          description: True when running on the demo database with fake customers (docs/adr/0008).

    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          description: Which input was wrong, e.g. `text`, `limit` or `Idempotency-Key`.
        message:
          type: string
          description: What's wrong, in words a user can understand.

    Problem:
      type: object
      description: RFC 9457 Problem Details. Never contains stack traces, SQL or secrets.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: Identifies the kind of problem.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: [string, "null"]
          description: Explanation specific to this occurrence.
        instance:
          type: [string, "null"]
          description: The request path that caused it.
        errors:
          type: array
          description: Per-field problems (present on 400/422 validation errors).
          items:
            $ref: "#/components/schemas/FieldError"

  responses:
    BadRequest:
      description: The request is malformed (e.g. a query value of the wrong type, an invalid cursor or a missing header).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://kiakia.app/problems/bad-request
            title: The request is malformed
            status: 400
            detail: "1 parameter is invalid."
            instance: /v1/conversations
            errors:
              - field: cursor
                message: is not a valid cursor
    NotFound:
      description: The resource doesn't exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://kiakia.app/problems/not-found
            title: Not found
            status: 404
            detail: Conversation 999 does not exist.
            instance: /v1/conversations/999
    Conflict:
      description: The `Idempotency-Key` was already used with a different request body, or the first request with it is still being processed (or its delivery is unconfirmed).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://kiakia.app/problems/idempotency-key-reused
            title: Idempotency-Key reused with a different request
            status: 409
            detail: Use a new Idempotency-Key for a different reply.
            instance: /v1/conversations/42/replies
    ValidationError:
      description: The request is well-formed, but some fields are invalid. `errors` lists each one.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://kiakia.app/problems/validation-error
            title: Your request has invalid fields
            status: 422
            detail: "1 field is invalid."
            instance: /v1/conversations/42/replies
            errors:
              - field: text
                message: must not be empty
    BadGateway:
      description: |
        The channel (e.g. Telegram) refused the message (`channel-error`; nothing was sent), or we
        couldn't confirm delivery (`delivery-unknown`; it may have arrived, so check the chat before
        sending again with a NEW Idempotency-Key; retrying the same key returns 409 until it expires).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://kiakia.app/problems/channel-error
            title: The channel could not deliver the message
            status: 502
            detail: "Telegram: bot was blocked by the user"
            instance: /v1/conversations/42/replies
    ServiceUnavailable:
      description: A dependency (database or channel) is temporarily unavailable. Try again later.
      headers:
        Retry-After:
          description: Seconds to wait before retrying, when known.
          schema:
            type: integer
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://kiakia.app/problems/service-unavailable
            title: Service temporarily unavailable
            status: 503
            detail: The database is not reachable.
            instance: /v1/stats
    InternalError:
      description: An unexpected error. Details are logged on the server, never sent to the client.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://kiakia.app/problems/internal-error
            title: Something went wrong on our side
            status: 500
            detail: null
            instance: /v1/conversations
