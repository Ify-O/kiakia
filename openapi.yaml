openapi: 3.1.0
info:
  title: Kiakia API
  version: 1.0.0
  summary: Every customer, answered fast.
  description: |
    The contract for Kiakia, a single inbox for small businesses that sell through chat.
    It is the **source of truth** (see `docs/adr/0001`): the server is tested against it, and the
    web UI is generated from it.

    Conventions:
    - JSON fields are `camelCase`. Times are RFC 3339 in **UTC** (e.g. `2026-11-24T18:55:24Z`);
      clients show them in the business's time zone.
    - Lists use **cursor pagination** (`limit` + opaque `cursor`, see `docs/adr/0003`).
    - Errors use **RFC 9457 Problem Details** (`application/problem+json`, see `docs/adr/0002`).
    - Fields that can be empty are marked nullable (`type: [string, "null"]`); they're always
      present in responses, never omitted.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  contact:
    name: Kiakia
    url: https://github.com/Ify-O/kiakia

servers:
  - url: http://localhost:8000
    description: Local development (the API runs on your own laptop)

# No authentication yet: the API only runs locally. Staff logins come with the multi-user work.
security: []

tags:
  - name: Conversations
    description: Chat threads with customers, including who is still waiting for a reply.
  - name: Messages
    description: The messages inside a conversation.
  - name: Replies
    description: Send a reply to a customer from Kiakia.
  - name: Stats
    description: Numbers for the dashboard.
  - name: Health
    description: Is the API (and its database) up?

paths:
  /v1/conversations:
    get:
      operationId: listConversations
      tags: [Conversations]
      summary: List conversations
      description: |
        Conversations with filters and cursor pagination. Use `status=waiting&sort=longestWaiting`
        for the "customers still waiting for a reply" view, oldest wait first.
      parameters:
        - name: status
          in: query
          description: "`waiting` = the customer's last message has no reply yet. `answered` = the business replied last."
          schema:
            type: string
            enum: [all, waiting, answered]
            default: all
        - name: channel
          in: query
          description: Only conversations on this channel.
          schema:
            $ref: "#/components/schemas/Channel"
        - name: q
          in: query
          description: Case-insensitive search in the customer's name or username.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: sort
          in: query
          description: "`recent` = most recent message first. `longestWaiting` = longest-waiting customer first (waiting conversations only)."
          schema:
            type: string
            enum: [recent, longestWaiting]
            default: recent
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of conversations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: getConversation
      tags: [Conversations]
      summary: Get one conversation
      description: Full details of one conversation and its customer.
      responses:
        "200":
          description: The conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/conversations/{conversationId}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: listMessages
      tags: [Messages]
      summary: List the messages in a conversation
      description: Newest message first. Follow `page.nextCursor` to load older messages.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/conversations/{conversationId}/replies:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      operationId: createReply
      tags: [Replies]
      summary: Send a reply to the customer
      description: |
        Sends `text` to the customer on the conversation's channel and stores it as an outgoing
        message. The conversation stops being "waiting".

        **Idempotent** (see `docs/adr/0004`): send a unique `Idempotency-Key` per reply. Repeating
        the same request with the same key returns the original result and does **not** send the
        message again (`Idempotent-Replayed: true`). Reusing a key with a different body returns 409.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: A unique value per reply, created once by the client (a UUID is recommended).
          schema:
            type: string
            minLength: 8
            maxLength: 255
            pattern: "^[A-Za-z0-9_-]+$"
          example: 5f1d8a2e-7c3b-4e1a-9b6f-2d4c8e0a1b3f
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyCreate"
            example:
              text: "Hi Ada! The blue bag is ₦15,000. Shall I reserve one for you?"
      responses:
        "201":
          description: The reply was sent and stored (or replayed from an earlier identical request).
          headers:
            Location:
              description: URL of the conversation's messages.
              schema:
                type: string
            Idempotent-Replayed:
              description: "`true` when this response is a replay of an earlier request with the same key."
              schema:
                type: string
                enum: ["true", "false"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/stats:
    get:
      operationId: getStats
      tags: [Stats]
      summary: Dashboard numbers
      description: Totals and the current waiting situation, for the dashboard.
      responses:
        "200":
          description: Current numbers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxStats"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Health check
      description: "`200` when the API and its database work; `503` when the database is unreachable."
      responses:
        "200":
          description: Everything works.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      description: The conversation's id.
      schema:
        type: integer
        format: int64
        minimum: 1
    Limit:
      name: limit
      in: query
      description: How many items to return (1–100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Opaque value from `page.nextCursor` of the previous page. Don't build or change it.
      schema:
        type: string
        minLength: 1
        maxLength: 500

  schemas:
    Channel:
      type: string
      description: Where the conversation happens.
      enum: [telegram, messenger, instagram, whatsapp, tiktok, email]

    Direction:
      type: string
      description: "`in` = from the customer, `out` = from the business."
      enum: [in, out]

    MessageKind:
      type: string
      enum: [text, voice, audio, image, video, document, sticker, other]

    ConversationStatus:
      type: string
      description: "`waiting` = the customer's last message has no reply yet."
      enum: [waiting, answered]

    Contact:
      type: object
      additionalProperties: false
      required: [id, displayName, username]
      properties:
        id:
          type: integer
          format: int64
        displayName:
          type: string
          description: Name to show, e.g. "Ada Test" or "@buyer_two".
          example: Ada Test
        username:
          type: [string, "null"]
          description: The customer's handle on the channel, if they have one.
          example: ada_test

    ConversationSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - channel
        - contact
        - status
        - waitingSince
        - lastMessageAt
        - lastReplyAt
        - lastMessagePreview
        - unansweredCount
      properties:
        id:
          type: integer
          format: int64
          example: 42
        channel:
          $ref: "#/components/schemas/Channel"
        contact:
          $ref: "#/components/schemas/Contact"
        status:
          $ref: "#/components/schemas/ConversationStatus"
        waitingSince:
          type: [string, "null"]
          format: date-time
          description: Time of the first customer message without a reply. `null` when not waiting.
        lastMessageAt:
          type: string
          format: date-time
          description: Time of the most recent message in either direction.
        lastReplyAt:
          type: [string, "null"]
          format: date-time
          description: When the business last replied. `null` if it never has.
        lastMessagePreview:
          type: [string, "null"]
          maxLength: 120
          description: Start of the latest customer message, or e.g. "[voice]" for media. `null` if there is none.
          example: Hello, how much is the blue bag?
        unansweredCount:
          type: integer
          minimum: 0
          description: Customer messages since the last reply.

    ConversationDetail:
      description: A conversation with extra details about the customer.
      allOf:
        - $ref: "#/components/schemas/ConversationSummary"
        - type: object
          required: [createdAt, messageCount]
          properties:
            createdAt:
              type: string
              format: date-time
            messageCount:
              type: integer
              minimum: 0

    Message:
      type: object
      additionalProperties: false
      required: [id, conversationId, direction, kind, body, hasMedia, sentAt]
      properties:
        id:
          type: integer
          format: int64
        conversationId:
          type: integer
          format: int64
        direction:
          $ref: "#/components/schemas/Direction"
        kind:
          $ref: "#/components/schemas/MessageKind"
        body:
          type: [string, "null"]
          description: Text or caption. `null` for media without a caption (e.g. a voice note).
        hasMedia:
          type: boolean
          description: True for voice notes, images and other files.
        sentAt:
          type: string
          format: date-time

    ReplyCreate:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4096
          description: The reply. Leading and trailing spaces are removed; it must not be empty after that. Max 4096 characters (Telegram's limit).

    PageInfo:
      type: object
      additionalProperties: false
      required: [limit, nextCursor]
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        nextCursor:
          type: [string, "null"]
          description: Pass as `cursor` to get the next page. `null` = this is the last page.

    ConversationPage:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSummary"
        page:
          $ref: "#/components/schemas/PageInfo"

    MessagePage:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        page:
          $ref: "#/components/schemas/PageInfo"

    InboxStats:
      type: object
      additionalProperties: false
      required: [contacts, conversations, messages, waiting, oldestWaitingSince, messagesByKind]
      properties:
        contacts:
          type: integer
          minimum: 0
        conversations:
          type: integer
          minimum: 0
        messages:
          type: integer
          minimum: 0
        waiting:
          type: integer
          minimum: 0
          description: Conversations whose customer is waiting for a reply.
        oldestWaitingSince:
          type: [string, "null"]
          format: date-time
          description: When the longest-waiting customer started waiting. `null` if nobody is waiting.
        messagesByKind:
          type: object
          description: Message count per kind; kinds with no messages are left out.
          propertyNames:
            $ref: "#/components/schemas/MessageKind"
          additionalProperties:
            type: integer
            minimum: 0
          example:
            text: 12
            voice: 3

    Health:
      type: object
      additionalProperties: false
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [ok]

    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          description: Which input was wrong, e.g. `text`, `limit` or `Idempotency-Key`.
        message:
          type: string
          description: What's wrong, in words a user can understand.

    Problem:
      type: object
      description: RFC 9457 Problem Details. Never contains stack traces, SQL or secrets.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: Identifies the kind of problem.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: [string, "null"]
          description: Explanation specific to this occurrence.
        instance:
          type: [string, "null"]
          description: The request path that caused it.
        errors:
          type: array
          description: Per-field problems (present on 400/422 validation errors).
          items:
            $ref: "#/components/schemas/FieldError"

  responses:
    BadRequest:
      description: The request is malformed (e.g. a query value of the wrong type, an invalid cursor or a missing header).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://kiakia.app/problems/bad-request
            title: The request is malformed
            status: 400
            detail: "1 parameter is invalid."
            instance: /v1/conversations
            errors:
              - field: cursor
                message: is not a valid cursor
    NotFound:
      description: The resource doesn't exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://kiakia.app/problems/not-found
            title: Not found
            status: 404
            detail: Conversation 999 does not exist.
            instance: /v1/conversations/999
    Conflict:
      description: The `Idempotency-Key` was already used with a different request body.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://kiakia.app/problems/idempotency-key-reused
            title: Idempotency-Key reused with a different request
            status: 409
            detail: Use a new Idempotency-Key for a different reply.
            instance: /v1/conversations/42/replies
    ValidationError:
      description: The request is well-formed, but some fields are invalid. `errors` lists each one.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://kiakia.app/problems/validation-error
            title: Your request has invalid fields
            status: 422
            detail: "1 field is invalid."
            instance: /v1/conversations/42/replies
            errors:
              - field: text
                message: must not be empty
    BadGateway:
      description: The channel (e.g. Telegram) refused or failed to deliver the message.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://kiakia.app/problems/channel-error
            title: The channel could not deliver the message
            status: 502
            detail: "Telegram: bot was blocked by the user"
            instance: /v1/conversations/42/replies
    ServiceUnavailable:
      description: A dependency (database or channel) is temporarily unavailable. Try again later.
      headers:
        Retry-After:
          description: Seconds to wait before retrying, when known.
          schema:
            type: integer
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://kiakia.app/problems/service-unavailable
            title: Service temporarily unavailable
            status: 503
            detail: The database is not reachable.
            instance: /v1/stats
    InternalError:
      description: An unexpected error. Details are logged on the server, never sent to the client.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://kiakia.app/problems/internal-error
            title: Something went wrong on our side
            status: 500
            detail: null
            instance: /v1/conversations
