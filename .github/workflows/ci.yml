# Runs on every push and pull request: lint, type check, migrations and all tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kiakia
          POSTGRES_PASSWORD: ci-only-password   # throwaway CI database, not a real secret
          POSTGRES_DB: kiakia
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U kiakia -d kiakia"
          --health-interval 5s --health-retries 10

    env:
      POSTGRES_USER: kiakia
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: kiakia
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "55432"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python and dependencies (exactly as in uv.lock)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Formatting (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Database migrations apply cleanly
        run: uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head

      - name: Tests (unit + integration)
        run: uv run pytest -v
