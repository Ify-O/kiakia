[project]
name = "kiakia"
version = "0.1.0"
description = "Every customer, answered fast: one inbox for chat-first small businesses."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.9",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "openapi-core>=0.23.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "schemathesis>=4.34.2",
    "types-openpyxl>=3.1.5.20261122",
    "types-pyyaml>=6.0.12.20261122",
    "types-requests>=2.33.0.20261030",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs PostgreSQL running in Docker (docker compose up -d)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes (unused imports, undefined names)
    "I",        # import sorting
    "UP",       # pyupgrade: modern Python syntax
    "B",        # bugbear: likely bugs
    "SIM",      # simplifications
    "S",        # bandit: security checks
    "RUF",      # ruff-specific
]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow ₦ and typographic characters in text

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]  # asserts, fake test passwords and test-only SQL
"migrations/versions/**" = ["E501"]  # applied migrations are never edited, not even for style

[tool.mypy]
python_version = "3.12"
strict = true
files = ["kiakia"]
